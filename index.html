<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ODIN RPS</title>
    <link rel="stylesheet" href="style.css" />
    <sciprt src="script.js" defer></sciprt>
  </head>
  <body>
    <h1 class="title">ROCK PAPER SCISSORS</h1>
    <div class="players">
      <div class="human">
        <h2 class="player-name">Your Hand</h2>
        <div class="human-choices">
          <button class="choice">
            <img src="img/odin-rock.png" />
            <p>ROCK</p>
          </button>
          <button class="choice">
            <img src="img/odin-paper.png" />
            <p>PAPER</p>
          </button>
          <button class="choice">
            <img src="img/odin-scissor.png" />
            <p>SCISSOR</p>
          </button>
      </div>
      <div class="computer">
        <h2>Computer's Hand</h2>
          <button class="comp-choice">
            <img src="img/odin-rock.png"/>
            <p>ROCK</p>
          </button>
      </div>
    </div>
    </div>
    <div class="score-bar">
      <div class="score-side left-side">
        <p>YOU</p>
        <div class="human-results">
          <div class="result">
            <img class="placeholder" src="img/odin-rps-placeholder.png" />
          </div>
          <div class="result">
            <img class="placeholder" src="img/odin-rps-placeholder.png" />
          </div>
          <div class="result">
            <img class="placeholder" src="img/odin-rps-placeholder.png" />
          </div>
          <div class="result">
            <img class="placeholder" src="img/odin-rps-placeholder.png" />
          </div>
          <div class="result">
            <img class="placeholder" src="img/odin-rps-placeholder.png" />
          </div>
        </div>
      </div>
      <button class="nexticon">
        <img src="img/next-icon.png">
      </button>
      <div class="score-side right-side">
        <div class="comp-results">
          <div class="result">
            <img class="placeholder" src="img/odin-rps-placeholder.png" />
          </div>
          <div class="result">
            <img class="placeholder" src="img/odin-rps-placeholder.png" />
          </div>
          <div class="result">
            <img class="placeholder" src="img/odin-rps-placeholder.png" />
          </div>
          <div class="result">
            <img class="placeholder" src="img/odin-rps-placeholder.png" />
          </div>
          <div class="result">
            <img class="placeholder" src="img/odin-rps-placeholder.png" />
          </div>
        </div>
        <p>COMPUTER</p>
      </div>
    </div>
  </body>
</html>
